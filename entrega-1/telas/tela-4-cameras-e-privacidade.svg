<text x="52" y="393" font-size="12" font-weight="400" fill="#5B6770" text-anchor="start" >Zona de câmera sem sinal aparece no mapa como “sem dado”. Zona simulada leva sempre o rótulo</text>
<text x="52" y="410" font-size="12" font-weight="400" fill="#5B6770" text-anchor="start" >“Simulação”. Uma câmera pode cobrir mais de uma zona.</text>
<rect x="800" y="66" width="456" height="180" rx="6" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5" />
<circle cx="828" cy="90" r="11" fill="#2E7D32"/><path d="M822,90 l4,5 l8,-9" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
<text x="848" y="95" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start" >O que coletamos</text>
<text x="820" y="126" font-size="12.5" font-weight="400" fill="#1F2933" text-anchor="start" >Só a contagem de pessoas por zona e por janela de 15 minutos.</text>
<text x="820" y="150" font-size="12" font-weight="400" fill="#5B6770" text-anchor="start" >Registro enviado ao servidor:</text>
<rect x="820" y="160" width="416" height="34" rx="4" fill="#F0F4F8" stroke="#C9D1D9" stroke-width="1" />
<text x="1028.0" y="182" font-size="12.5" font-weight="600" fill="#1F2933" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">{ zona_id, inicio_janela, duracao_min, contagem, fonte }</text>
<text x="820" y="220" font-size="12" font-weight="400" fill="#5B6770" text-anchor="start" >Contagem menor que 5 é exibida como “abaixo do limiar”, sem número.</text>
<rect x="800" y="258" width="456" height="180" rx="6" fill="#FFFFFF" stroke="#BD0026" stroke-width="1.5" />
<circle cx="828" cy="282" r="11" fill="#BD0026"/><path d="M823,277 l10,10 M833,277 l-10,10" stroke="#FFFFFF" stroke-width="2.4"/>
<text x="848" y="287" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start" >O que não coletamos</text>
<path d="M822,311 l9,9 M831,311 l-9,9" stroke="#BD0026" stroke-width="2"/>
<text x="842" y="320" font-size="12.5" font-weight="400" fill="#1F2933" text-anchor="start" >Imagem ou vídeo: nenhum frame é gravado ou transmitido</text>
<path d="M822,339 l9,9 M831,339 l-9,9" stroke="#BD0026" stroke-width="2"/>
<text x="842" y="348" font-size="12.5" font-weight="400" fill="#1F2933" text-anchor="start" >Rosto: não há reconhecimento facial</text>
<path d="M822,367 l9,9 M831,367 l-9,9" stroke="#BD0026" stroke-width="2"/>
<text x="842" y="376" font-size="12.5" font-weight="400" fill="#1F2933" text-anchor="start" >Trajetória individual: ninguém é seguido entre zonas</text>
<path d="M822,395 l9,9 M831,395 l-9,9" stroke="#BD0026" stroke-width="2"/>
<text x="842" y="404" font-size="12.5" font-weight="400" fill="#1F2933" text-anchor="start" >Identificador de aparelho: sem Wi-Fi e sem BLE</text>
<rect x="24" y="450" width="1232" height="232" rx="6" fill="#FFFFFF" stroke="#C9D1D9" stroke-width="1" />
<text x="40" y="476" font-size="15" font-weight="700" fill="#1F2933" text-anchor="start" >Como a contagem é feita (no agente de borda, ao lado da câmera)</text>
<rect x="48" y="498" width="200" height="84" rx="6" fill="#F7F9FB" stroke="#52606D" stroke-width="1.5" />
<text x="148" y="524" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle" >1. Frame</text>
<text x="148" y="546" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >A câmera entrega</text><text x="148" y="562" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >um quadro ao agente</text>
<line x1="252" y1="540" x2="292" y2="540" stroke="#5B6770" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="296" y="498" width="200" height="84" rx="6" fill="#F7F9FB" stroke="#52606D" stroke-width="1.5" />
<text x="396" y="524" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle" >2. Detecção</text>
<text x="396" y="546" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >YOLOX-S acha pessoas,</text><text x="396" y="562" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >na CPU, em memória</text>
<line x1="500" y1="540" x2="540" y2="540" stroke="#5B6770" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="544" y="498" width="200" height="84" rx="6" fill="#F7F9FB" stroke="#52606D" stroke-width="1.5" />
<text x="644" y="524" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle" >3. Contagem</text>
<text x="644" y="546" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >Pessoas dentro de cada</text><text x="644" y="562" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >zona, por janela de 15 min</text>
<line x1="748" y1="540" x2="788" y2="540" stroke="#5B6770" stroke-width="1.8" marker-end="url(#seta)"/>
<rect x="792" y="498" width="200" height="84" rx="6" fill="#FFF5F5" stroke="#BD0026" stroke-width="1.5" />
<text x="892" y="524" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle" >4. Frame descartado</text>
<text x="892" y="546" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >Apagado da memória;</text><text x="892" y="562" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >nada vai para disco ou rede</text>
<path d="M644,582 L644,634 L1034,634" fill="none" stroke="#5B6770" stroke-width="1.8" marker-end="url(#seta)"/>
<text x="662" y="626" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="start" >POST só com a contagem agregada</text>
<rect x="1040" y="498" width="192" height="160" rx="6" fill="#EDF7ED" stroke="#2E7D32" stroke-width="1.5" />
<text x="1136" y="524" font-size="13.5" font-weight="700" fill="#1F2933" text-anchor="middle" >Servidor</text>
<text x="1136" y="546" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >API valida o registro</text>
<text x="1136" y="562" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >e grava no banco</text>
<line x1="1056" y1="578" x2="1216" y2="578" stroke="#A5D6A7" stroke-width="1" />
<text x="1136" y="600" font-size="12" font-weight="700" fill="#1F2933" text-anchor="middle" >Recebe: contagens</text>
<text x="1136" y="620" font-size="12" font-weight="700" fill="#BD0026" text-anchor="middle" >Nunca recebe: imagem</text>
<text x="1136" y="644" font-size="11.5" font-weight="400" fill="#5B6770" text-anchor="middle" >Mapa, ranking e gráficos</text>
<rect x="36" y="488" width="968" height="106" rx="6" fill="none" stroke="#7B8794" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="48" y="624" font-size="12" font-weight="400" fill="#5B6770" text-anchor="start" >Linha tracejada: tudo ali dentro acontece no agente de borda.</text>
<text x="48" y="644" font-size="12.5" font-weight="700" fill="#1F2933" text-anchor="start" >A imagem não sai dali.</text>
<rect x="24" y="694" width="1232" height="76" rx="6" fill="#FFF8E1" stroke="#C99A00" stroke-width="1" />
<path d="M52,716 l13,24 h-26 z" fill="#C99A00"/><text x="52" y="736" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >!</text>
<text x="80" y="720" font-size="13" font-weight="700" fill="#1F2933" text-anchor="start" >Ponto em aberto: validação jurídica (LGPD)</text>
<text x="80" y="740" font-size="12" font-weight="400" fill="#1F2933" text-anchor="start" >Captar imagem, mesmo sem armazenar, pode ser tratamento de dado pessoal. Antes de usar em um shopping real, o desenho precisa de</text>
<text x="80" y="757" font-size="12" font-weight="400" fill="#1F2933" text-anchor="start" >validação jurídica e de aviso ao público sobre as câmeras. Isto é uma hipótese de projeto, não uma conclusão.</text>
<text x="1256" y="790" font-size="11" font-weight="400" fill="#7B8794" text-anchor="end" >Wireframe — dados ilustrativos</text>
